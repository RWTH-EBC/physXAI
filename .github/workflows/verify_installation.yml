name: Verify Installation

on:
  pull_request:
    branches:
    - main
    - refactoring_v1.0.0  # phase PRs of the 1.0.0 refactoring, remove after the release # Runs on PRs targeting the main branch

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # identical scripts on Linux and Windows runners
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install requirements and add python path
      run: |
        python -m pip install --upgrade pip
        pip install .
    # Runs simple verification script
    - name: Verify installation with simple example script
      run: python unittests/verify_installation.py
