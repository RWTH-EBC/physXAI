name: Code Quality

# Lint (ruff) and a strict build of the documentation: broken links, missing pages and docstrings that do
# not match the function signatures fail the build. The documentation is deployed by gh-pages.yml on main.
on:
  pull_request:
    # 'edited' covers a changed base branch (stacked PRs), see the job conditions
    types: [opened, synchronize, reopened, edited]
    branches:
    - main
    - refactoring_v1.0.0  # phase PRs of the 1.0.0 refactoring, remove after the release

  workflow_dispatch:

jobs:
  lint:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Ruff
      run: |
        pip install "ruff>=0.12"
        ruff check physXAI unittests executables

  docs:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[docs]
    - name: Build documentation (strict)
      env:
        NO_MKDOCS_2_WARNING: 1
      run: mkdocs build --strict
